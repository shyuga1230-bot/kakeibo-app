<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4F46E5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="かけいぼ">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>オフライン — かけいぼ</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: #F8F9FF;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 40px 28px;
      box-shadow: 0 4px 24px rgba(79, 70, 229, 0.08);
      text-align: center;
      max-width: 340px;
      width: 100%;
    }
    .emoji { font-size: 56px; display: block; margin-bottom: 20px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #EEF2FF;
      color: #4F46E5;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 18px;
      letter-spacing: 0.05em;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 10px;
    }
    .sub {
      font-size: 13px;
      color: #6B7280;
      line-height: 1.7;
      margin-bottom: 20px;
    }
    .notice {
      background: #F0FDF4;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 13px;
      color: #15803D;
      line-height: 1.7;
      margin-bottom: 24px;
      text-align: left;
    }
    .notice span { display: block; }
    .btn {
      display: inline-block;
      padding: 12px 32px;
      background: #4F46E5;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
      width: 100%;
    }
    .btn:active { background: #4338CA; }
  </style>
</head>
<body>
  <div class="card">
    <span class="emoji">💰</span>
    <div class="badge">かけいぼ</div>
    <h1>オフラインです</h1>
    <p class="sub">インターネットに接続されていません。</p>
    <div class="notice">
      <span>💾 保存済みのデータはこの端末に残っています</span>
      <span>接続が戻ったらもう一度開いてください</span>
    </div>
    <button class="btn" onclick="location.reload()">再読み込みする</button>
  </div>
</body>
</html>
